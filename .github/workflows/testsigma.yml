name: Testsigma Execution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Testsigma script
        run: bash scripts/testsigma.sh
        env:
          TESTSIGMA_API_KEY: ${{ secrets.TESTSIGMA_API_KEY }}

      # Upload PDF as GitHub Actions artifact
      - name: Upload Testsigma PDF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsigma-execution-report
          path: Reports/testsigma_execution_report.pdf
          if-no-files-found: warn

      # Commit PDF into Reports folder
      - name: Commit Testsigma PDF Report
        if: always()
        run: |
          echo "Checking generated report..."

          if [ -f "Reports/testsigma_execution_report.pdf" ]; then
            echo "Report found. Committing to repository..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add Reports/testsigma_execution_report.pdf

            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Update Testsigma execution report"
              git push
            fi
          else
            echo "Report file not found. Nothing to commit."
          fi
